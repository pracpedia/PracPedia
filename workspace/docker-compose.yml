# Production docker-compose for PracPedia
# Usage:
#   1. Copy .env.example to .env and edit values (set JWT_SECRET!)
#   2. docker compose up -d --build
#   3. docker compose exec app bunx prisma db push   (first run only)
#   4. docker compose exec app bunx tsx prisma/seed.ts (first run only)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pracpedia-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Persist SQLite DB across container rebuilds (mounted into /app/data)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - pracpedia-net

  # ── Reverse proxy with auto-HTTPS via Caddy ───────────────────────────────
  # Uncomment if you want automatic TLS termination on a real domain.
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: pracpedia-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - app
  #   environment:
  #     - DOMAIN=pracpedia.example.com  # change to your domain
  #   networks:
  #     - pracpedia-net

networks:
  pracpedia-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
